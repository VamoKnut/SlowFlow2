name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SlowFlow.sln --locked-mode

      - name: Build
        run: dotnet build SlowFlow.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SlowFlow.sln --configuration Release --no-build

  firmware:
    name: Portenta firmware build and test compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Build Portenta firmware
        run: pio run --project-dir firmware

      - name: Compile embedded tests
        run: >-
          pio test --project-dir firmware --environment portenta_h7_m7
          --without-uploading --without-testing
